# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  # The physical bridge may need up to 15 seconds after the nominal trajectory
  # duration for the measured joints to enter the goal tolerance. Include that
  # convergence window so MoveIt does not cancel a robot that is still settling.
  allowed_start_tolerance: 0.08
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 20.0

moveit_simple_controller_manager:
  controller_names:
    - arm_group_controller

  arm_group_controller:
    type: FollowJointTrajectory
    joints:
      - 1_Joint
      - 2_Joint
      - 3_Joint
      - 4_Joint
      - 5_Joint
      - 6_Joint
    action_ns: follow_joint_trajectory
    default: true
