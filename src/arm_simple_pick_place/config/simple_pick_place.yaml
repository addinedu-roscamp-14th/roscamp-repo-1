/arm/simple_pick_place:
  ros__parameters:
    # direct: pymycobot sync_send_coords (recommended first)
    # moveit: MoveGroup for XY/attitude, Cartesian path for every Z-only move
    motion_backend: direct

    # Both ArUco poses are transformed into this frame and frozen before
    # pick_and_place starts moving.
    base_frame: base_link
    pick_marker_frame: arm/pick_marker
    place_marker_frame: arm/place_marker

    # Observation happens before manipulation. Every service visits first,
    # stores whichever required markers are visible, and then always visits
    # second to find anything that is still missing. A first-view miss does
    # not stop the operation.
    # These values live only in this new package; the old
    # config/arm/container_pick_place.yaml is not loaded.
    first_observation_joint_angles_deg: [
      1.0, 57.0, -28.0, -85.0, 16.0, -45.0
    ] #첫번째 포즈 degree
    # second_observation_joint_angles_deg: [
    #  현재 각도: [-86.39, 57.12, -15.46, -88.15, 7.99, -36.82]
    second_observation_joint_angles_deg: [
      -79.0, 34.0, -56.0, -42.0, 11.0, -39.0
    ] #두번째 포즈 degree
    observation_settle_sec: 1.0
    observation_joint_tolerance_deg: 3.0
    observation_speed: 15
    # First is only an opportunistic view, so a miss advances quickly.
    # Second gets the full time to stabilize every still-missing marker.
    first_observation_timeout_sec: 3.0  #첫번째 포즈 탐색시간
    second_observation_timeout_sec: 3.0  #두번째포즈 탐색시간

    # pymycobot send_coords/get_coords controls this measured frame. It is a
    # fixed child of arm/6_Link, but is neither the URDF TCP nor the camera.
    command_frame: arm/controller_coords

    # Both Pick and Place command yaw = wrap(marker yaw + this offset).
    marker_yaw_offset_deg: -45.0
    # All absolute heights are in base_frame metres.
    approach_z_m: 0.200
    pick_z_offset_m: 0.025
    pick_lift_z_m: 0.180
    place_z_offset_m: 0.025
    retreat_z_m: 0.200

    minimum_stable_samples: 7
    max_translation_std_m: 0.003
    max_yaw_spread_deg: 5.0
    max_marker_age_sec: 1.0

    # Temporarily relaxed for end-to-end operation testing.
    position_tolerance_m: 0.015
    angle_tolerance_deg: 6.0

    serial_port: /dev/ttyUSB0
    baud_rate: 1000000
    speed: 50
    motion_timeout_sec: 20.0
    gripper_open_value: 100
    gripper_closed_value: 20
    gripper_speed: 80
    gripper_wait_sec: 1.0
    joint_state_rate_hz: 10.0

    moveit_group: arm_group
    # MoveIt still plans its modeled robot link. controller_coords describes
    # the separate pymycobot Direct backend command frame.
    moveit_ee_link: 6_Link
    moveit_planning_time_sec: 8.0
    moveit_planning_attempts: 10
    moveit_velocity_scale: 0.25
    moveit_acceleration_scale: 0.20
    cartesian_max_step_m: 0.001
    cartesian_min_fraction: 0.995
