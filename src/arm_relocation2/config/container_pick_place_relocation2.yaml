/arm/container_pick_place_coordinator:
  ros__parameters:
    # Order: [floor marker, bottom container, ..., top container].
    source_stack: "[9, 3, 8, 0]"

    # Empty destination has the same ordering. Initially this normally
    # contains only its floor marker. Existing containers may also be listed.
    empty_stack: "[1]"

    target_container_id: 3
    final_place_marker_id: 6

    # Only top markers are valid pick/place coordinates.
    top_face_max_angle_deg: 30.0

    # Detection is disabled during every robot motion. It is enabled only
    # after settling at an observation pose.
    observation_settle_sec: 1.0
    observation_capture_sec: 2.0
    pending_detection_timeout_sec: 2.0
    tf_failure_log_period_sec: 1.0

    # Relocation-only motion profile.
    moveit_velocity_scale: 0.50
    moveit_acceleration_scale: 0.35
    cartesian_max_speed_mps: 0.06
