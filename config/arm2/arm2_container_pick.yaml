/arm2/arm2_container_pick_coordinator:
  ros__parameters:
    base_frame: arm2/base_link
    marker_frame: arm2/container_marker

    # Motion requires the explicit execute_motion launch override.
    execute_motion: false
    motion_backend: direct
    allow_full_pick: true
    # Keep physical motion locked until arm2 Hand-Eye and grasp offsets are
    # measured on the second robot.
    # Re-taught after the 2026-07-21 intrinsic and Hand-Eye recalibration.
    offsets_configured: true
    use_marker_rotation_for_grasp: false
    grasp_orientation_mode: marker_yaw

    # Stable base-frame marker median: [0.1134885, -0.1008325, 0.083675] m.
    # Centered ROS TCP TF: [0.110037, -0.093533, -0.006764] m. The JetCobot
    # get_coords TCP uses a different origin and is intentionally not used.
    grasp_offset_xyz_m: [-0.0034515, 0.0072995, -0.090439]
    # Exact 0-degree pitch is unreachable at the taught low-Z target. Use the
    # smallest practical tilt, close to the physically taught -8.37 degrees.
    grasp_offset_rpy_deg: [-180.0, -5.0, 178.208716]
    reference_marker_yaw_deg: 65.0927595
    # The marker-to-grasp XY offset is expressed in the container frame, so it
    # rotates in the same direction as container yaw.
    rotate_grasp_xy_offset_with_marker: true
    # Accept every container direction. MoveIt and the Cartesian planner still
    # reject orientations that are physically unreachable or unsafe.
    max_yaw_spread_deg: 12.0
    max_container_yaw_delta_deg: 180.0
    # If full container-yaw following cannot reach the final Z, retain as much
    # yaw as possible while testing reachable fallback orientations.
    grasp_yaw_fallback_scales: [0.5, 0.0]
    # First align XY and the downward wrist 5 cm above the target, then make a
    # straight vertical Cartesian descent to the taught grasp height.
    pregrasp_lift_m: 0.05
    # Use the calibrated nominal grasp depth. Additional descent pushed the
    # recalibrated target below the base-frame workspace floor.
    grasp_extra_depth_m: 0.0
    # The wrist camera loses the top marker near grasp. This is safe only while
    # the container remains fixed after its base-frame target is locked.
    refresh_marker_before_descent: false
    # At pregrasp, reacquire the marker while stationary and automatically
    # refine only XY/yaw. Keep the taught grasp Z unchanged.
    visual_refine_max_xy_m: 0.020
    visual_refine_max_yaw_deg: 15.0
    # Reach pregrasp XYZ with the current wrist attitude first, then align to
    # the grasp attitude at the same XYZ. This avoids the straight-arm IK branch
    # that immediately enters self-collision during vertical descent.
    pregrasp_test_keep_current_orientation: true
    # Lift 18 cm after closing: previous 8 cm plus 10 cm clearance.
    lift_after_pick_m: 0.18
    minimum_lift_after_pick_m: 0.05
    lift_search_step_m: 0.02

    minimum_stable_samples: 20
    max_translation_std_m: 0.004
    max_rotation_spread_deg: 9.0
    dry_run_max_rotation_spread_deg: 30.0
    max_marker_age_sec: 3.0
    stabilization_timeout_sec: 6.0

    # Never plan a TCP target below this base-frame floor.
    # The physically taught centered grasp is z=-0.0128 m in base_link.
    # Permit only 7 mm below that pose; lower targets remain blocked.
    workspace_min_xyz_m: [-0.28, -0.28, -0.020]
    workspace_max_xyz_m: [0.28, 0.28, 0.30]
    # XY workspace is a bottom/right inverted L: a horizontal bar in
    # Y <= 0 plus a vertical bar in X >= 0. Bounds are in base_link metres.
    workspace_xy_shape: inverted_l
    workspace_horizontal_min_xy_m: [-0.28, -0.28]
    workspace_horizontal_max_xy_m: [0.28, 0.0]
    workspace_vertical_min_xy_m: [0.0, -0.28]
    workspace_vertical_max_xy_m: [0.28, 0.28]
    max_joint_delta_deg: 60.0

    serial_port: /dev/jetcobot
    baud_rate: 1000000
    speed: 5
    motion_timeout_sec: 30.0
    gripper_open_value: 100
    gripper_closed_value: 20
    gripper_speed: 50

    moveit_group: arm_group
    moveit_ee_link: arm2/TCP
    move_group_action: /arm2/move_action
    execute_trajectory_action: /arm2/execute_trajectory
    compute_cartesian_path_service: /arm2/compute_cartesian_path
    moveit_position_tolerance_m: 0.005
    moveit_orientation_tolerance_deg: 5.0
    moveit_planning_time_sec: 3.0
    moveit_planning_attempts: 5
    moveit_velocity_scale: 0.55
    moveit_acceleration_scale: 0.40

    # Pregrasp is planned normally. Grasp descent and lift are Cartesian Z
    # paths with collision checking and joint-jump rejection.
    # Five-millimetre interpolation is sufficiently dense for this 5 cm drop.
    cartesian_max_step_m: 0.005
    # Prefer 97% completion. A path down to 90% is accepted only when the
    # measured TCP-to-target residual is at most 5 mm.
    cartesian_min_fraction: 0.97
    cartesian_absolute_min_fraction: 0.90
    cartesian_max_shortfall_m: 0.005
    cartesian_max_speed_mps: 0.08
    cartesian_max_joint_jump_deg: 15.0
    moveit_state_settle_sec: 0.05
    # MoveIt/action success is insufficient: also verify measured TCP XYZ.
    # Physical JetCobot Cartesian repeatability is about 8-14 mm even when
    # its joint action succeeds. The pregrasp remains 50 mm above the object;
    # the following descent is separately collision/path checked.
    motion_position_check_tolerance_m: 0.010
    # Only the waypoint 5 cm above the object may use this wider limit. The
    # Cartesian grasp target below is still verified with the strict 10 mm.
    pregrasp_position_check_tolerance_m: 0.015
    # Pregrasp is still 50 mm above the object. Permit the observed 9-degree
    # wrist error so the vertical descent can proceed; final grasp stays 8 deg.
    pregrasp_orientation_check_tolerance_deg: 10.0
    # JetCobot wrist settles with several degrees of gear/backlash error.
    # Position and orientation checks both remain strict.
    motion_orientation_check_tolerance_deg: 8.0
    # Do not issue additional over-commanded TCP pose corrections. Verify the
    # pregrasp arrival once; descend only when it satisfies both limits.
    motion_correction_attempts: 0
    # Verify the final grasp from five distinct 10 Hz TCP updates. A stale
    # single TF or a still-moving wrist can no longer trigger gripper close.
    tcp_verification_samples: 5
    tcp_verification_max_spread_m: 0.0025
    # If the stable final pose is close but outside tolerance, execute the
    # original grasp target once more. Never add the measured error to the
    # command, because that amplified backlash in earlier trials.
    final_grasp_retry_attempts: 1
    final_grasp_retry_max_position_error_m: 0.025
    final_grasp_retry_max_orientation_error_deg: 12.0

    # Return joints restored from deleted backup arm2_startup_pose.yaml:
    # [0.52, -0.43, -10.105, -67.805, 0.08, 45.79] deg.
    # These Cartesian fields remain only for compatibility with older configs.
    initial_pose_xyz_m: [0.0, 0.0, 0.0]
    initial_pose_rpy_deg: [0.0, 0.0, 0.0]
    # On success keep the gripper closed and carry the object back to the
    # restored startup pose. Failures open the gripper before recovery.
    auto_return_after_pick: true
    auto_return_after_failure: true
    auto_return_after_pregrasp_test: true
    auto_return_on_startup: true
    # Poll readiness and move immediately; no fixed startup delay.
    startup_return_poll_sec: 0.5
