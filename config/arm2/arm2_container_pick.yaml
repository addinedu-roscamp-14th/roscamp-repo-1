/arm2/arm2_jetcobot_trajectory_bridge:
  ros__parameters:
    # 2026-07-28에 arm2 실기에서 읽은 현재 자세를 홈으로 사용합니다.
    home_joint_angles_deg:
    - 87.01
    - 55.54
    - -83.58
    - -36.47
    - 4.57
    - -52.11
    go_home_on_startup: true
    go_home_on_shutdown: true
    home_speed: 50
    home_tolerance_deg: 3.5
    home_timeout_sec: 15.0
    joint1_sweep_speed: 25
    joint1_sweep_angle_deg: 336.0
    joint1_sweep_tolerance_deg: 3.5
    joint1_sweep_duration_sec: 20.0
    max_j6_trajectory_travel_deg: 150.0

/arm2/arm2_container_pick_coordinator:
  ros__parameters:
    base_frame: arm2/base_link
    marker_frame: arm2/container_marker
    execute_motion: true
    motion_backend: direct
    allow_full_pick: true
    offsets_configured: true
    use_marker_rotation_for_grasp: false
    grasp_orientation_mode: marker_yaw
    # 그리퍼 yaw만 컨테이너를 추종하고 XYZ 오프셋은 base_link 방향에 고정합니다.
    rotate_grasp_offset_with_marker_yaw: false
    grasp_offset_xyz_m:
    - 0.014261
    - -0.000085
    - -0.062462
    # arm2/base_link 기준 고정 보정. 컨테이너 yaw와 함께 회전하지 않습니다.
    base_correction_xyz_m:
    - -0.01
    - 0.03
    - 0.0
    grasp_offset_rpy_deg:
    - -180.0
    - 0.0
    - -94.071
    reference_marker_yaw_deg: 2.349
    # 직사각형 컨테이너와 그리퍼는 180도 회전을 같은 파지 자세로 취급합니다.
    container_yaw_symmetry_deg: 180.0
    prefer_current_gripper_yaw: true
    max_yaw_spread_deg: 12.0
    max_container_yaw_delta_deg: 180.0
    grasp_yaw_fallback_scales:
    - 0.75
    - 0.5
    - 0.25
    - 0.0
    pregrasp_lift_m: 0.08
    grasp_extra_depth_m: 0.0
    grasp_stop_above_m: 0.02
    refresh_marker_before_descent: false
    pregrasp_test_keep_current_orientation: true
    lift_after_pick_m: 0.18
    minimum_lift_after_pick_m: 0.05
    lift_search_step_m: 0.02
    stack_container_height_m: 0.035
    stack_approach_clearance_m: 0.08
    stack_minimum_approach_clearance_m: 0.03
    stack_approach_search_step_m: 0.01
    stack_xy_offset_m:
    - 0.0
    - 0.0
    stack_z_offset_m: 0.015
    max_stack_levels: 3
    stack_source_orientation_mode: marker_yaw
    stack_segmented_descent_min_fraction: 0.65
    stack_segmented_descent_max_segments: 5
    stack_pose_goal_finish_max_distance_m: 0.075
    scan_marker_pause_sec: 0.5
    scan_timeout_sec: 90.0
    prefer_z_last_motion: false
    minimum_stable_samples: 5
    max_translation_std_m: 0.005
    max_rotation_spread_deg: 10.0
    dry_run_max_rotation_spread_deg: 30.0
    max_marker_age_sec: 3.0
    stabilization_timeout_sec: 20.0
    workspace_min_xyz_m:
    - -0.28
    - -0.28
    - -0.025
    workspace_max_xyz_m:
    - 0.28
    - 0.28
    - 0.3
    workspace_xy_shape: inverted_l
    workspace_horizontal_min_xy_m:
    - -0.28
    - -0.28
    workspace_horizontal_max_xy_m:
    - 0.28
    - 0.0
    workspace_vertical_min_xy_m:
    - 0.0
    - -0.28
    workspace_vertical_max_xy_m:
    - 0.28
    - 0.28
    max_joint_delta_deg: 60.0
    serial_port: /dev/jetcobot
    baud_rate: 1000000
    speed: 5
    motion_timeout_sec: 30.0
    gripper_open_value: 100
    gripper_closed_value: 20
    gripper_speed: 50
    moveit_group: arm_group
    moveit_ee_link: arm2/TCP
    move_group_action: /arm2/move_action
    execute_trajectory_action: /arm2/execute_trajectory
    compute_cartesian_path_service: /arm2/compute_cartesian_path
    moveit_position_tolerance_m: 0.005
    moveit_orientation_tolerance_deg: 5.0
    moveit_planning_time_sec: 10.0
    moveit_planning_attempts: 20
    moveit_velocity_scale: 0.35
    moveit_acceleration_scale: 0.25
    cartesian_max_step_m: 0.001
    cartesian_min_fraction: 0.97
    cartesian_absolute_min_fraction: 0.9
    cartesian_max_shortfall_m: 0.005
    cartesian_max_speed_mps: 0.04
    cartesian_max_joint_jump_deg: 15.0
    moveit_state_settle_sec: 0.2
